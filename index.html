<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soñá y Doná</title>
<style>
  :root{
    --bg:#050b14;
    --panel:#0a1522;
    --mint:#5be8c9;
    --blue:#4fa3e0;
    --text:#f2f5f7;
    --muted:#7c8a94;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .screen{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:28px 20px 0;
  }
  /* Hero banner */
  .hero{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 18px;
    border-radius:40px;
    background:linear-gradient(180deg,#0d1b28,#08131e);
    text-decoration:none;
    color:inherit;
    isolation:isolate;
  }
  .hero::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:40px;
    padding:1.5px;
    background:linear-gradient(90deg,var(--blue),var(--mint));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    z-index:-1;
  }
  .hero-icon{
    flex:0 0 auto;
    width:54px;
    height:54px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at 35% 30%,#12324a,#0a1c2c);
    box-shadow:0 0 18px rgba(79,163,224,.45);
  }
  .hero-icon svg{width:26px;height:26px;}
  .hero-title{
    flex:1;
    font-size:1.55rem;
    font-weight:700;
    letter-spacing:.2px;
  }
  .hero-arrow{
    color:var(--muted);
    font-size:1.3rem;
  }
  /* Cards row */
  .cards{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:22px;
  }
  .card{
    position:relative;
    background:linear-gradient(180deg,#0a1a24,#071119);
    border-radius:22px;
    padding:22px 16px;
    min-height:190px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    text-decoration:none;
    color:inherit;
  }
  .card::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:22px;
    padding:1.2px;
    background:linear-gradient(160deg,rgba(79,163,224,.55),rgba(91,232,201,.55) 60%,rgba(91,232,201,0));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
  }
  .card-icon{
    width:52px;
    height:52px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at 35% 30%,#12324a,#0a1c2c);
    box-shadow:0 0 16px rgba(91,232,201,.35);
    margin-bottom:28px;
  }
  .card-icon svg{width:24px;height:24px;}
  .card-title{
    font-size:1.28rem;
    font-weight:700;
    line-height:1.22;
  }
  /* Section label row */
  .section-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:26px;
    padding:0 2px;
  }
  .section-label{
    font-size:.82rem;
    font-weight:700;
    letter-spacing:2px;
    color:var(--muted);
  }
  .section-link{
    font-size:.95rem;
    font-weight:700;
    color:var(--mint);
    text-decoration:none;
  }
  .spacer{flex:1;}
  /* Bottom nav */
  .nav{
    display:flex;
    align-items:center;
    justify-content:space-around;
    padding:16px 10px calc(16px + env(safe-area-inset-bottom));
    border-top:1px solid rgba(255,255,255,.06);
  }
  .nav svg{width:26px;height:26px;}
  .nav .active{color:var(--mint);}
  .nav .inactive{color:#4a5560;}
</style>
</head>
<body>
  <div class="screen">

    <a class="hero" href="#" aria-label="Cumplí tu sueño">
      <span class="hero-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#bfe6ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 20l7-7"/>
          <path d="M14.5 3.5l1.7 1.7"/>
          <path d="M18 2l1 1"/>
          <path d="M20 5l1 1"/>
          <path d="M17 8l1 1"/>
          <path d="M12 4.5l6.5 6.5-2 2L10 6.5z"/>
        </svg>
      </span>
      <span class="hero-title">Cumplí tu sueño</span>
      <span class="hero-arrow">&rsaquo;</span>
    </a>

    <div class="cards">
      <a class="card" href="#">
        <span class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#bfe6ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 8l7 7"/>
            <path d="M6 11l5-5 5 5-5 5z"/>
            <path d="M3 20h7"/>
            <path d="M4.5 14.5l3 3"/>
          </svg>
        </span>
        <span class="card-title">Sueños en<br>subasta activa</span>
      </a>

      <a class="card" href="#">
        <span class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#8ff2d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.5 12.5l-8-8H5v7.5l8 8a1.5 1.5 0 0 0 2 0l5.5-5.5a1.5 1.5 0 0 0 0-2z"/>
            <circle cx="8.5" cy="8.5" r="2.2"/>
            <path d="M8.5 7.3v1.2l.9.9"/>
          </svg>
        </span>
        <span class="card-title">Sueños por<br>subastar</span>
      </a>
    </div>

    <div class="section-row">
      <span class="section-label">DESCUBRÍ</span>
      <a class="section-link" href="#">Ver todas &rsaquo;</a>
    </div>

    <div class="spacer"></div>

    <nav class="nav">
      <svg class="inactive" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.8 8.6c0 4.6-8.8 10.4-8.8 10.4S3.2 13.2 3.2 8.6a4.6 4.6 0 0 1 8.8-1.8A4.6 4.6 0 0 1 20.8 8.6z"/>
      </svg>
      <svg class="active" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 11.5L12 4l9 7.5"/>
        <path d="M5.5 10v9h13v-9"/>
      </svg>
      <svg class="inactive" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 16v-5a6 6 0 1 0-12 0v5l-2 3h16z"/>
        <path d="M10 21a2 2 0 0 0 4 0"/>
      </svg>
    </nav>

  </div>
</body>
</html>
